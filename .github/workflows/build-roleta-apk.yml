name: Build Roleta MyBets APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/roleta-mybets/**"
      - ".github/workflows/build-roleta-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/roleta-mybets

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/RoletaMyBets.apk

      - name: Publish APK to repository
        working-directory: .
        run: |
          mkdir -p backend/frontend/downloads
          cp android/roleta-mybets/app/build/outputs/apk/debug/RoletaMyBets.apk backend/frontend/downloads/RoletaMyBets.apk
          git config user.name "MyBets"
          git config user.email "jp_veiculos@icloud.com"
          git add backend/frontend/downloads/RoletaMyBets.apk
          if git diff --cached --quiet; then
            echo "APK sem alterações."
            exit 0
          fi
          git commit -m "Android: publicar APK da Roleta MyBets"
          git push origin HEAD:main

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoletaMyBets
          path: android/roleta-mybets/app/build/outputs/apk/debug/RoletaMyBets.apk
          if-no-files-found: error
