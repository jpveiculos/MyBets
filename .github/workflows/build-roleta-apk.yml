name: Build Roleta MyBets APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/roleta-mybets/**"
      - ".github/workflows/build-roleta-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/roleta-mybets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/RoletaMyBets.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoletaMyBets
          path: android/roleta-mybets/app/build/outputs/apk/debug/RoletaMyBets.apk
          if-no-files-found: error
