name: Code checks

on:
  pull_request:
    branches: [main]
  push:
    branches: ["feature/group-roulette", "feature/group-roulette-admin-config"]

jobs:
  syntax-and-integration:
    name: JavaScript syntax and database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mybets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mybets_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mybets_test
      DATABASE_SSL: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test group roulette transactions and concurrency
        run: npm test
