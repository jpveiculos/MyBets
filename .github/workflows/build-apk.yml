name: Build MyBets APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Locate APK
        run: |
          find app/build/outputs -type f -name "*.apk" -print
          test -n "$(find app/build/outputs -type f -name "*.apk" -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyBets-release-apk
          path: android/app/build/outputs/**/*.apk
          if-no-files-found: error

      - name: Publish APK release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-v1.0.3
          name: MyBets Android 1.0.3
          target_commitish: ${{ github.sha }}
          body: "Aplicativo MyBets para Android."
          files: android/app/build/outputs/apk/release/app-release.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
