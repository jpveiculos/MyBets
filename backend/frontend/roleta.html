<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MyBets — Roleta</title>
<link rel="stylesheet" href="/roleta.css">
</head>
<body>
<div class="wrap">
<header class="header">
<a class="logo" href="/" aria-label="MyBets"><span class="logo-my">My</span><span class="logo-bets">Bets</span></a>
<div class="account-boxes"><div class="account-box"><span>SALDO</span><b id="cashBalance">R$ 0,00</b></div><div class="account-box"><span>CRÉDITOS</span><b id="balance">0,00</b></div></div>
</header>
<main class="game">
<div class="wheel-box">
<div class="pointer"></div>
<div class="wheel" id="wheel"><svg id="wheelSvg" viewBox="0 0 400 400" aria-label="Roleta MyBets"></svg></div>
<svg class="wheel-rim" viewBox="0 0 400 400" aria-hidden="true">
  <defs>
    <linearGradient id="fixed-outer-metallic-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1a3"/>
      <stop offset="18%" stop-color="#d99a17"/>
      <stop offset="38%" stop-color="#8f5a00"/>
      <stop offset="50%" stop-color="#ffe27a"/>
      <stop offset="66%" stop-color="#b87408"/>
      <stop offset="84%" stop-color="#fff0a0"/>
      <stop offset="100%" stop-color="#9a6100"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#4b2d00" stroke-width="18" filter="drop-shadow(0 6px 5px rgba(0,0,0,.8))"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#fixed-outer-metallic-gold)" stroke-width="12"/>
  <circle cx="200" cy="200" r="184" fill="none" stroke="#fff1a3" stroke-width="2" opacity=".8"/>
</svg>
<div class="hub"><div class="hub-logo"><div class="hub-main"><span class="hub-my">My</span><span class="hub-bets">Bets</span></div><div class="hub-sub">JOGOS ONLINE</div></div></div>
</div>
<div class="controls">
<div class="bet-row">
<span>Valor da aposta</span>
<div class="bet-controls">
<button id="betMinus" type="button">−</button>
<input id="betAmount" type="number" min="0.50" max="100" step="0.50" value="0.50" inputmode="decimal">
<button id="betPlus" type="button">+</button>
</div>
</div>
<div class="quick-deposit" aria-label="Valor da aposta">
  <span class="quick-deposit-title">Valor da aposta</span>
  <div class="quick-deposit-options">
    <button type="button" data-bet-value="1">R$ 1</button>
    <button type="button" data-bet-value="2">R$ 2</button>
    <button type="button" data-bet-value="3">R$ 3</button>
    <button type="button" data-bet-value="5">R$ 5</button>
    <button type="button" data-bet-value="10">R$ 10</button>
  </div>
</div>
<button class="spin" id="spinButton" type="button">↻ GIRAR</button>
</div>
</main>
</div>
<div class="notice" id="result"></div>
<div class="notice" id="message"></div>
<nav class="nav">
<a href="/dashboard.html"><span>👤</span><b>Área de jogador</b></a>
<a href="/"><span>⌂</span><b>Início</b></a>
</nav>
<script src="/roleta.js"></script>
</body>
</html>
