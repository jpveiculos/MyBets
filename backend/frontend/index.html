<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08090d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MyBets">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.svg">
  <title>MyBets Roulette</title>
  <link rel="stylesheet" href="/style.css?v=20260920-carousel-2">
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-wordmark" aria-label="MyBets"><span class="brand-word-my">My</span><span class="brand-word-bets">Bets</span></span></a>
      <div class="home-auth session-pending" id="homeAuth"><button class="ghost-btn" id="openLogin">Entrar / Cadastrar</button></div>
    </header>

    <main class="home-main">
  <section class="home-hero" id="inicio">
    <div class="home-hero-image">
      <img src="/assets/home/jpbet-hero-luxo-clean.PNG" alt="MyBets">
    </div>
  </section>

  <section class="home-games-section" id="jogos" aria-label="Jogos">
    <div class="home-games-header">
      <h2>Jogos</h2>
      <div class="home-games-controls" aria-label="Navegação dos jogos">
        <button type="button" class="home-games-arrow" id="gamesPrev" aria-label="Jogo anterior">‹</button>
        <button type="button" class="home-games-arrow" id="gamesNext" aria-label="Próximo jogo">›</button>
      </div>
    </div>
    <div class="home-games" id="homeGames">
      <article class="home-game-card">
        <div class="home-game-art home-roulette-art" aria-hidden="true">
          <div class="home-roulette-ring"><span>My<span>Bets</span></span><small>JOGOS ONLINE</small></div>
        </div>
        <h2>My Roulette</h2>
        <a class="home-game-button" href="/roleta.html">JOGAR AGORA</a>
      </article>

      <article class="home-game-card">
        <div class="home-game-art home-machine-art" aria-hidden="true">🐯</div>
        <h2>My Tiger</h2>
        <a class="home-game-button" href="/my-tiger.html">JOGAR AGORA</a>
      </article>

      <article class="home-game-card">
        <div class="home-game-art home-machine-art" aria-hidden="true">🐉</div>
        <h2>My Dragon</h2>
        <a class="home-game-button" href="/my-dragon.html">JOGAR AGORA</a>
      </article>

      <article class="home-game-card">
        <div class="home-game-art home-machine-art" aria-hidden="true">7️⃣</div>
        <h2>My Lucky 7</h2>
        <a class="home-game-button" href="/lucky7.html">JOGAR AGORA</a>
      </article>
    </div>
  </section>

  <section class="home-app-cta" aria-label="Aplicativo MyBets">
    <div class="home-app-icon" aria-hidden="true">📱</div>
    <div class="home-app-copy">
      <strong>Baixe o aplicativo MyBets</strong>
      <span>Android: baixe o APK. iPhone: adicione o MyBets à Tela de Início pelo Safari.</span>
    </div>
    <a class="home-app-button" href="/baixar-app.html">BAIXAR APLICATIVO</a>
  </section>
</main>
  </div>

  <nav class="site-footer-nav hidden" id="playerFooterNav" aria-label="Navegação principal">
    <a href="/" class="active"><span>⌂</span><b>Início</b></a>
    <a href="/dashboard.html"><span>👤</span><b>Área do jogador</b></a>
  </nav>

  <div class="modal-backdrop hidden" id="authModal">
    <section class="modal">
      <button class="modal-close" id="closeAuth">×</button>
      <div class="modal-tabs">
        <button class="tab active" data-mode="login">Entrar</button>
        <button class="tab" data-mode="register">Criar conta</button>
      </div>
      <h2 id="authTitle">Entrar</h2>
      <form id="authForm">
        <label>Usuário<input id="username" autocomplete="username" required minlength="3"></label>
        <label>Senha<input id="password" type="password" autocomplete="current-password" required minlength="6"></label>
        <button class="primary-btn full" type="submit" id="authSubmit">Entrar</button>
        <p class="form-message" id="authMessage"></p>
      </form>
    </section>
  </div>
  <script>if(new URLSearchParams(location.search).get("login")==="1")document.getElementById("authModal")?.classList.remove("hidden");</script>
  <script src="/app.js?v=20260920-carousel"></script>
</body>
</html>
