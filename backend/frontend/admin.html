<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • MyBets Roulette</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="site-shell"><header class="topbar"><a class="brand" href="/"><span class="brand-my">MY</span>BETs</a><button class="ghost-btn hidden" id="adminLogout">Sair</button></header>
<main class="landing"><section class="panel" id="loginPanel"><span class="eyebrow">ÁREA ADMINISTRATIVA</span><h1>Admin</h1><form id="adminLogin"><label>Usuário<input id="adminUser" value="admin" autocomplete="username" required></label><label>Senha<input id="adminPassword" type="password" autocomplete="current-password" required></label><button class="primary-btn full">Entrar</button><p class="form-message" id="loginMessage"></p></form></section>
<section class="panel hidden" id="adminPanel"><span class="eyebrow">ADMINISTRAÇÃO</span><h1>Painel</h1><div id="adminMessage" class="form-message"></div><div class="admin-grid"><div class="admin-section"><h2>Usuários</h2><div id="users"></div></div><div class="admin-section"><h2>Depósitos pendentes</h2><div id="deposits"></div></div><div class="admin-section"><h2>Saques pendentes</h2><div id="withdrawals"></div></div><div class="admin-section"><h2>Configurações</h2><div id="settings"></div></div></div></section></main></div><script src="/admin.js"></script></body></html>
